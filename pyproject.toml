[project]
name = "school-contests"
version = "0.1.1"
description = "Локальное приложение для школьных конкурсов"
requires-python = ">=3.14,<3.15"
dependencies = ["PySide6>=6.10,<7", "SQLAlchemy>=2.0,<2.1", "openpyxl>=3.1,<4"]

[project.scripts]
school-contests = "school_contests.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.5", "pyinstaller>=6.16", "pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/school_contests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-p no:cacheprovider"

